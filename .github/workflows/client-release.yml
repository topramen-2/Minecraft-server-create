name: Publish complete Alaska client
on:
  push:
    branches: [main]
    paths:
      - 'release/**'
      - '.github/workflows/client-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alaska-client-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify complete client
        run: |
          python3 release/build.py
          python3 release/audit.py
      - name: Commit synchronized individual mods and manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alaska-v2/individual-mods release/client-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync all 120 client mods for Alaska v2.1.0'
            git push origin HEAD:main
          fi
      - name: Publish release with all downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.1.0-alaska >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create v2.1.0-alaska release-assets/* \
            --target "$(git rev-parse HEAD)" \
            --title 'Create Kingdoms Alaska v2.1.0 — Complete Client Pack' \
            --notes-file release/RELEASE-NOTES.md --draft
          gh release edit v2.1.0-alaska --draft=false --latest
